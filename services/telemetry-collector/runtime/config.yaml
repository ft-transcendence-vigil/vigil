# Default image configuration. The main Compose stack selects a Vault-rendered config.
extensions:
  bearertokenauth:
    scheme: Bearer
    token: ${env:VIGIL_INGESTION_KEY}

receivers:
  # Accept all three OTLP signals over HTTP using the configured bearer token.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Each pipeline limits memory before buffering telemetry for export.
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:COLLECTOR_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:COLLECTOR_MEMORY_SPIKE_LIMIT_MIB}
  batch:
    timeout: 5s
    send_batch_size: 1000
    send_batch_max_size: 5000

exporters:
  # Use the ClickHouse writer account and notify the backend after rows become visible.
  vigilclickhouse:
    clickhouse_endpoint: ${env:CLICKHOUSE_ENDPOINT}
    clickhouse_database: ${env:CLICKHOUSE_DATABASE}
    clickhouse_username: ${env:CLICKHOUSE_USERNAME}
    clickhouse_password: ${env:CLICKHOUSE_PASSWORD}
    backend_callback_url: ${env:BACKEND_CALLBACK_URL}
    max_serialized_batch_bytes: ${env:MAX_SERIALIZED_BATCH_BYTES}
    dedup_window: 10m

service:
  extensions: [bearertokenauth]
  # Each signal follows the same component order through a separate pipeline.
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [vigilclickhouse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [vigilclickhouse]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [vigilclickhouse]
