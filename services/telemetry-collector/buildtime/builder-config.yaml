dist:
  name: vigcol
  version: 0.160.0
  output_path: /home/ocb/dist

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.66.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.66.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.160.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.160.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.160.0

exporters:
  - gomod: github.com/ft-transcendence-vigil/vigil/services/telemetry-collector/buildtime/exporter v1.3.3-7
    name: vigilclickhouseexporter

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.160.0

replaces:
  - github.com/ft-transcendence-vigil/vigil/services/telemetry-collector/buildtime/exporter => /home/ocb/exporter
