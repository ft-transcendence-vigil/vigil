<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050910" />
    <meta name="color-scheme" content="dark" />
    <title>Vigil - Offline</title>
    <style>
      @font-face {
        font-family: 'Poppins';
        src: url('/fonts/poppins-semibold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --bg: #050910;
        --surface: #080d1a;
        --fg: #ffffff;
        --muted: #6b7da8;
        --accent: #2196f3;
        --red: #ef4444;
        --line: #1a2333;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        overflow-x: hidden;
        background-color: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0.015em;
      }

      header {
        position: relative;
        text-align: center;
        z-index: 1;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        display: inline-block;
        padding: 4px 18px;
        background: var(--accent);
        color: var(--surface);
        font-family: 'Poppins', system-ui, sans-serif;
        font-weight: 600;
        font-size: 24px;
        line-height: 1.333333;
        letter-spacing: 0.025em;
        text-transform: uppercase;
        transform: rotate(-3deg) skewX(10deg);
      }

      main {
        position: relative;
        z-index: 1;
        flex: 1;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: 48px 24px 64px;
        text-align: center;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        padding: 6px 10px;
        border: 1px solid var(--red);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--red);
      }
      h1 {
        margin-bottom: 12px;
        font-family: 'Poppins', system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(28px, 6vw, 40px);
        letter-spacing: 0.025em;
      }
      p.msg {
        max-width: 400px;
        margin-bottom: 28px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }
      button {
        padding: 12px 24px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #000000;
        background: var(--accent);
        border: 0;
        border-radius: 0;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.7;
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 3px;
      }
      .watermark::before {
        content: 'VIGIL';
        position: fixed;
        right: -3%;
        bottom: -8%;
        font-family: 'Poppins', sans-serif;
        font-size: clamp(12rem, 24vw, 30rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        color: transparent;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.025);
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body class="watermark">
    <header><span class="logo">VIGIL</span></header>

    <main role="alert">
      <div class="status">Connection lost</div>
      <h1>You're offline</h1>
      <p class="msg">
        Vigil needs a connection for live logs and alerts. We'll reconnect
        automatically.
      </p>
      <button type="button" id="retry">Retry now</button>
    </main>

    <script>
      document
        .getElementById('retry')
        .addEventListener('click', () => location.reload());
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
