spring.application.name=FT_TRANSCENDENCE


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

clickhouse.url=${CLICKHOUSE_URL}
clickhouse.username=${CLICKHOUSE_USERNAME}
clickhouse.password=${CLICKHOUSE_PASSWORD}
clickhouse.driver-class-name=com.clickhouse.jdbc.Driver


spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never


spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

vigil.jwt-secret=${JWT_SECRET:}
vigil.ingestion-key=${VIGIL_INGESTION_KEY:}
vigil.frontend-base-url=${VIGIL_FRONTEND_BASE_URL:${VIGIL_FRONT_END_URL:http://localhost:3000}}
vigil.front-end-url=${VIGIL_FRONT_END_URL:${vigil.frontend-base-url}}
vigil.silence-timeout-seconds=${VIGIL_SILENCE_TIMEOUT_SECONDS:300}
vigil.llm-base-url=${VIGIL_LLM_BASE_URL:http://llm:8000}
vigil.llm-timeout-seconds=${VIGIL_LLM_TIMEOUT_SECONDS:30}

vigil.access-token-expiration=900000
vigil.refresh-token-expiration=2592000000



spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.property-naming-strategy=SNAKE_CASE
