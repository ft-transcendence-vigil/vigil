spring.application.name=FT_TRANSCENDENCE

# In-memory database for tests
spring.datasource.url=jdbc:h2:mem:vigiltest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dummy ClickHouse settings
clickhouse.url=jdbc:clickhouse://localhost:8123/default
clickhouse.username=default
clickhouse.password=
clickhouse.driver-class-name=com.clickhouse.jdbc.Driver

# Test-only JWT secret
vigil.jwt-secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

vigil.access-token-expiration=900000
vigil.refresh-token-expiration=2592000000

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.property-naming-strategy=SNAKE_CASE