# The API uses PUT/PATCH/DELETE; CRS defaults to GET HEAD POST OPTIONS.
# Keep method enforcement enabled rather than removing rule 911100.
SecAction "id:100002,phase:1,pass,nolog,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# OTLP exporters send binary Protobuf, which the CRS content-type policy omits.
# Match the original URI because Nginx removes the prefix before proxying.
SecRule REQUEST_URI_RAW "@rx ^/otlp/v1/(?:logs|metrics|traces)(?:\?.*)?$" \
    "id:100040,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@streq application/x-protobuf" \
            "t:none,t:lowercase,ctl:ruleRemoveById=920420"

# Reproduced with CRS 4.29 at PL2: opaque JSON passwords containing SQL/HTML
# or /etc/passwd trigger injection rules. Exclude only that parsed field on
# credential-writing routes, not the body, email, query arguments, or all CRS.
# JSON parsing, body limits and protocol/method checks remain active.
SecRule REQUEST_FILENAME "@rx ^/api/(?:auth/login|setup|users(?:/me)?)$" \
    "id:100010,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PATCH)$" "chain"
        SecRule REQBODY_PROCESSOR "@streq JSON" \
            "ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.password,\
            ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.password,\
            ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.password,\
            ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.password"

# Prevent false positives on the Ask AI endpoint.
SecRule REQUEST_FILENAME "@rx ^/api/alerts/[0-9a-fA-F-]{36}/ask$" \
    "id:100030,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "chain"
        SecRule REQBODY_PROCESSOR "@streq JSON" \
            "ctl:ruleRemoveTargetByTag=attack-rce;ARGS"
# This endpoint intentionally accepts an HTTPS origin. CRS 931130 flags that URL
# as remote-file inclusion; the helper separately rejects paths and non-HTTPS URLs.
SecRule REQUEST_FILENAME "@streq /api/config/tls/addresses" \
    "id:100020,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "chain"
        SecRule REQBODY_PROCESSOR "@streq JSON" \
            "ctl:ruleRemoveTargetById=931130;ARGS:json.address"
