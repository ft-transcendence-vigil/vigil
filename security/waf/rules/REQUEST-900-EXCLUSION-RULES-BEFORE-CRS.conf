# The API uses PUT/PATCH/DELETE; CRS defaults to GET HEAD POST OPTIONS.
# Keep method enforcement enabled rather than removing rule 911100.
SecAction "id:100002,phase:1,pass,nolog,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# Reproduced with CRS 4.29 at PL2: opaque JSON passwords containing SQL/HTML
# or /etc/passwd trigger injection rules. Exclude only that parsed field on
# credential-writing routes, not the body, email, query arguments, or all CRS.
# JSON parsing, body limits and protocol/method checks remain active.
SecRule REQUEST_FILENAME "@rx ^/api/(?:auth/login|setup|users(?:/me)?)$" \
    "id:100010,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PATCH)$" "chain"
        SecRule REQBODY_PROCESSOR "@streq JSON" \
            "ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.password,\
            ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.password,\
            ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.password,\
            ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.password"
