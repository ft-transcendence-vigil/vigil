services:

  reverse-proxy:
    container_name: vigil-reverse-proxy
    build:
      context: .
      dockerfile: services/reverse-proxy/Dockerfile
    environment:
      VIGIL_DOMAIN: "${VIGIL_DOMAIN:-localhost}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      telemetry-collector:
        condition: service_started
    restart: unless-stopped

  ollama:
    container_name: vigil-ollama
    image: "${OLLAMA_IMAGE:-ollama/ollama:0.12.3}"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-model-init:
    image: "${OLLAMA_IMAGE:-ollama/ollama:0.12.3}"
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${OLLAMA_MODEL}"]

  llm:
    container_name: vigil-llm
    build:
      context: ./services/llm
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-4096}"
      OLLAMA_NUM_PREDICT: "${OLLAMA_NUM_PREDICT:-200}"
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0.3}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-25}"
      MAX_CONTEXT_LOGS: "${MAX_CONTEXT_LOGS:-20}"
      MAX_CONTEXT_METRICS: "${MAX_CONTEXT_METRICS:-10}"
      MAX_CONTEXT_TRACES: "${MAX_CONTEXT_TRACES:-10}"
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    container_name: vigil-api
    build:
      context: ./services/api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in .env}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-lopo}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    container_name: vigil-postgres
    image: "${POSTGRES_IMAGE}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-lopo}"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
        - -d
        - "${POSTGRES_DB:-lopo}"
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    container_name: vigil-clickhouse
    image: "${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8.6.5-distroless}"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in .env}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-default}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --host
        - localhost
        - --user
        - "${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in .env}"
        - --password
        - "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
        - --database
        - "${CLICKHOUSE_DB:-default}"
        - --query
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-init:
    image: "${CLICKHOUSE_CLIENT_IMAGE:-clickhouse/clickhouse-server:26.8.6.5}"
    restart: "no"
    environment:
      CLICKHOUSE_ADMIN_USER: "${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in .env}"
      CLICKHOUSE_ADMIN_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-default}"
      CLICKHOUSE_WRITER_PASSWORD: "${CLICKHOUSE_WRITER_PASSWORD}"
    volumes:
      - ./services/telemetry-db/clickhouse-init.sh:/clickhouse-init.sh:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/clickhouse-init.sh"]

  telemetry-collector:
    container_name: vigil-telemetry-collector
    build:
      context: ./services/telemetry-collector
      dockerfile: buildtime/Dockerfile
    environment:
      CLICKHOUSE_ENDPOINT: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DB:-default}"
      CLICKHOUSE_USERNAME: vigil_writer
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_WRITER_PASSWORD}"
      BACKEND_CALLBACK_URL: "${BACKEND_CALLBACK_URL}"
      MAX_SERIALIZED_BATCH_BYTES: "${MAX_SERIALIZED_BATCH_BYTES:-1048576}"
      COLLECTOR_MEMORY_LIMIT_MIB: "${COLLECTOR_MEMORY_LIMIT_MIB:-384}"
      COLLECTOR_MEMORY_SPIKE_LIMIT_MIB: "${COLLECTOR_MEMORY_SPIKE_LIMIT_MIB:-96}"
      VIGIL_INGESTION_KEY: "${VIGIL_INGESTION_KEY:?Set VIGIL_INGESTION_KEY in .env}"
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:

  postgres_data:
    name: postgres_data

  clickhouse_data:
    name: clickhouse_data

  caddy_data:
    name: vigil_caddy_data

  caddy_config:
    name: vigil_caddy_config

  ollama_data:
    name: vigil_ollama_data
